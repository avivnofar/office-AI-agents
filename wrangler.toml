name = "data-center-agents"
main = "workers/agent-runner.js"
compatibility_date = "2026-06-11"

# D1 database — storage for agents/agent_sessions/cases/interactions/reports/
# suggestions/weekly_analytics/meetings/side_plots/promotions/year_stats
# (database/schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "data-center-db"
database_id = "0819c65e-fa93-40cb-9894-c8dae0906f09"

# Live simulation overrides (inspection_mode/paused/phase) — see
# getSimulationState()/updateSimulationState() in agent-runner.js.
[[kv_namespaces]]
binding = "SIM_KV"
id = "62dd88c9524c4d048f99022a751a895e"

# Per-agent persisted state (mood/irritation/configOverrides) — see
# state-manager.js AgentStateDO.
[[durable_objects.bindings]]
name = "AGENT_STATE"
class_name = "AgentStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentStateDO"]

# Service binding to data-center-api — required because Cloudflare blocks a
# Worker from fetch()-ing another Worker's *.workers.dev URL directly (error
# 1042). interactWithApp() in agents/agent-base.js uses this binding.
[[services]]
binding = "APP_API"
service = "data-center-api"

# Workers AI — case routing/classification (callCFRouter()) and the
# fallback when Groq is unavailable or Gemini returns 429 (quota exhausted).
# Account-scoped binding, no extra credentials needed. See
# workers/gemini-client.js callCFRouter() / callCloudflareFallback().
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put <NAME>`, not here):
#   GEMINI_API_KEY    - required, report synthesis (monthly/quarterly/semi_yearly/yearly)
#                       + the Guides pipeline's writer-persona drafts
#   GROQ_API_KEY      - required, routine per-case agent work (callGroq(), config/token-economy.json)
#   GOOGLE_AI_API_KEY - optional, reserved for Google AI Studio report tooling (see token-economy.json)
#   ADMIN_TOKEN       - required, validates X-Admin-Token on /api/agents/*
#   GITHUB_TOKEN      - optional, gates report/guide commits + claude-action issues to GitHub.
#                       PUBLIC REPO ONLY. resolveRepoWrite() (workers/repo-write.js)
#                       maps the token to the destination repo with no fallback, so
#                       this one is never presented to a private target.
#   BACKOFFICE_REPO_TOKEN - required by TWO modules, and this line was missing from
#                       this block until 2026-08-08 despite both depending on it:
#                         * workers/office-context.js fetchOfficeSnapshot() — READS
#                           back-office BOARD.md + CLIENT-REQUIREMENTS.md. Unset does
#                           NOT raise: it returns {board:null, requirements:null,
#                           errors:['BACKOFFICE_REPO_TOKEN is not configured…']}, so
#                           `office_context_enabled` reads ON while every report is
#                           built on an empty office context. Probe it with
#                           `POST /api/agents/trigger {"type":"office_context_status"}`,
#                           which reports the token's presence and the parsed counts.
#                         * workers/repo-write.js — the WRITE credential for
#                           back-office-AI-agents (REPO_TO_TOKEN_SECRET), the path
#                           plan item 0.3 built. Unmapped or unset is a denial, never
#                           a fallback to GITHUB_TOKEN above.
#                       CONFIRMED SET on the Worker 2026-08-08 (owner).
#   WAREHOUSE_REPO_TOKEN - mapped in repo-write.js and DELIBERATELY NOT SET. The
#                       warehouse code-write exception is enforceable but not live:
#                       a warehouse write passes the code rule and is then denied for
#                       want of a token. Two independent locks — see CLAUDE.md.
#   GITHUB_MODELS_TOKEN - REMOVED 2026-08-06. GitHub Models was permanently retired
#                       on 2026-07-30; its client is deleted and no code reads this.
#                       The secret is DEAD and should be deleted from the Worker:
#                         npx wrangler secret delete GITHUB_MODELS_TOKEN
#                       This is NOT GITHUB_TOKEN above. That one carries repo WRITE
#                       scope for report/guide commits, is still required, and must
#                       NOT be deleted. The two were deliberately separate secrets
#                       precisely so one could be revoked without touching the other.
#   CEREBRAS_API_KEY  - task-type routing, judgment AND long-document lanes
#                       (workers/cerebras-client.js). Primary on both since the
#                       GitHub Models removal — see config/model-routing.json's
#                       _concentration_risk note.
#   MISTRAL_API_KEY   - task-type routing, backup lanes (workers/mistral-client.js)
#   COHERE_API_KEY    - task-type routing, embeddings lane (workers/cohere-client.js).
#                       No callers yet — the local brain's search is not built.
#                       TRIAL key, 1000 calls/MONTH — see config/token-economy.json.
#                       All three fail closed (logged, null) while unset. Routing itself
#                       ships OFF behind SIM_KV `routing_enabled`; see CLAUDE.md.
#   ANTHROPIC_API_KEY - required for the Guides pipeline (workers/claude-client.js,
#                       direct https://api.anthropic.com/v1/messages calls — the
#                       error-1042 *.workers.dev restriction doesn't apply to
#                       external hosts, so no service binding is needed). The
#                       11-agent Q&A engine's own Claude asks still go through
#                       the APP_API service binding above, unaffected by this.

# Per-block office-simulation cron — OFFICE HOURS, 08:00-18:00 Israel.
#
# CHANGED 2026-08-06 from `*/30 0-13,23 * * *` (which was 02:00-16:30 Israel,
# 30 ticks/day) to the two expressions below (08:00-18:00 Israel, 21
# ticks/day). The old window started before dawn because it was set to the
# owner's own activity window in July, not to anything the office needed.
#
# THE ARITHMETIC, against IDT = UTC+3, so you can re-derive it rather than
# trust it:
#   `*/30 5-14 * * *` -> minutes {0,30} x hours {5..14} UTC
#                     =  05:00 .. 14:30 UTC  =  08:00 .. 17:30 Israel  (20)
#   `0 15 * * *`      ->  15:00 UTC          =  18:00 Israel exactly    (1)
#                                               ------------------------
#                                               08:00-18:00 inclusive   21
#
# WHY TWO EXPRESSIONS AND NOT `*/30 5-15`: that form would also fire at
# 15:30 UTC = 18:30 Israel, half an hour past closing. The single `0 15`
# picks up the 18:00 boundary tick without the 18:30 one.
#
# Each tick, scheduled() converts to Israel local time and calls
# runScheduledBlock(), which is a NO-OP unless config/daily-schedule.json
# has a block at that exact time for that day-of-week. Ticks are therefore
# cheap; blocks are what cost anything.
#
# CONFIG THAT MOVED WITH THIS — config/daily-schedule.json. Five case_batch
# blocks sat before 08:00 (Sun-Thu 02:00/04:30/07:00, Friday 02:00/05:30)
# and were RETIMED into this window in the same change, not left outside
# it. That was not cosmetic: partitionCasesByShare() (agent-runner.js
# L1203) allocates each batch its `case_share` slice UP FRONT and does not
# redistribute a slice whose block never fires, so leaving them would have
# silently DROPPED 50% of a Sun-Thu day's question volume and 70% of a
# Friday's. No share value was edited and no block was added or removed —
# only times moved, so day totals are unchanged. Every block time must land
# on a :00 or :30 tick inside this window or it is simply never reached.
#
# DST CAVEAT — UNCHANGED AND STILL LOAD-BEARING. When Israel switches to
# IST (UTC+2, late Oct) or back to IDT (late Mar), update BOTH this cron
# window AND ISRAEL_UTC_OFFSET_HOURS (agent-runner.js L1767, hardcoded 3) —
# see CLAUDE.md. Neither self-corrects. At UTC+2 and with this cron left
# alone, the window silently becomes 07:00-17:00 Israel.
#
# DST AND THE LOCAL AUTOMATION RUNS. The Windows Task Scheduler runs on the
# owner's machine fire at 00:00 and 05:00 Israel LOCAL time (owner
# decision, 2026-08-06), and Task Scheduler self-corrects across DST
# because it is wall-clock local. This cron does not. At UTC+3 the 05:00
# run is 3 hours clear of this window's 08:00 open; at UTC+2 the window
# opens at 07:00 instead and that margin narrows to 2 hours. The
# separation survives the DST shift; the margin does not — so a future
# widening of this window toward the morning spends that margin.
# (ARCHITECT-AUTOMATION-SPEC.md in back-office states 02:30 and 07:28.
# Those times are STALE and superseded by the above; that file belongs to
# a separate chat and is corrected there, not here. The divergence is
# recorded in back-office-AI-agents/plans/OFFICE-SCALING-TODO.md.)
#
# RE-ENABLED 2026-07-18 (first live activation of the Q&A engine, after the
# 2026-07-08 pause) — first-days volume is capped by
# config/token-economy.json's graduated_rollout_throttle, see
# TOKEN-BUDGET.md's 2026-07-18 activation entry.
[triggers]
# RESTORED 2026-07-19 evening after the stale-DO-state incident fixes were
# verified live (micro-test + supervised block-by-block day 24, both clean —
# see TOKEN-BUDGET.md's 2026-07-19 entries).
crons = ["*/30 5-14 * * *", "0 15 * * *"]

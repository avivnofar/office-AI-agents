name = "data-center-agents"
main = "workers/agent-runner.js"
compatibility_date = "2026-06-11"

# workers.dev STAYS ON, and this line is a guard rather than a default.
#
# Added 2026-08-24 alongside the [[routes]] custom-domain block at the bottom
# of this file. Wrangler turns the `<name>.<subdomain>.workers.dev` route OFF
# by default once a config declares routes, and this Worker's workers.dev URL
# is NOT decorative:
#   * .github/workflows/owner-email.yml POSTs to
#     https://data-center-agents.avivnofar.workers.dev/api/agents/trigger
#   * dashboard/dashboard.js has it as API_BASE
#   * DEPLOY.md and CLAUDE.md document it as the operator's curl target
# Adding a custom domain without this line would have silently 404'd all three
# on the next deploy - a route change nobody would see until the owner's daily
# email stopped arriving. Setting it explicitly makes the value a decision in
# the file instead of a default that moved under us.
workers_dev = true

# ── CLOUDFLARE ACCESS — GOOGLE SIGN-IN AS THE OWNER'S CREDENTIAL ────────────
#
# Added 2026-08-25 (Session 18, Item A). Both values are EMPTY as shipped, and
# empty means INERT: workers/access-jwt.js refuses every assertion and
# workers/admin-gate.js falls through to the admin token exactly as it did
# before this block existed. Unconfigured is never a bypass.
#
# WHY THEY ARE VARS AND NOT SECRETS. Neither is a secret. The team domain is a
# public hostname and the AUD tag is a public application identifier — what
# protects the door is the SIGNATURE over the assertion, checked against
# Cloudflare's published keys. Putting them here means the next `wrangler
# deploy` cannot silently remove them, which is exactly what a dashboard-held
# value invites: the [observability] and [[routes]] blocks below are both in
# this file for that same recorded reason.
#
# WHY THEY ARE EMPTY RATHER THAN GUESSED. A JWT check with the WRONG audience
# accepts tokens minted for a DIFFERENT Access application — including one with
# a laxer policy. The session that wrote this could not read either value: the
# OAuth token wrangler holds has no Zero Trust scope (`npx wrangler whoami`
# lists none), and both values live in the Zero Trust dashboard. Guessing a team
# name that happens to exist would have pointed the check at a stranger's key
# set. So they are named, left empty, and filled in by the owner:
#
#   ACCESS_TEAM_DOMAIN  Zero Trust -> Settings -> Custom Pages (or the team
#                       domain on the Zero Trust overview). Either `myteam` or
#                       `myteam.cloudflareaccess.com` is accepted.
#   ACCESS_AUD          Zero Trust -> Access -> Applications -> (the /admin
#                       application) -> Overview -> Application Audience (AUD)
#                       Tag. 64 hex characters; a truncated paste is refused
#                       rather than half-accepted.
#
# THE POLICY IS THE OTHER HALF, AND IT IS NOT IN THIS FILE. As of 2026-08-25 the
# Access application has NO POLICY ATTACHED and enforces nothing — a live
# `GET https://office.avivnofar.com/admin/spec` returns the Worker's own 401 and
# never a redirect to cloudflareaccess.com. Filling these two values in does not
# by itself put Google sign-in in front of anything; attaching the `owner only`
# policy to the application does. See the Session 18 report.
#
# ── FILLED IN 2026-08-25 (Session 19, Item A) ───────────────────────────
#
# Appended, not rewritten. Everything above stands as the record of why these
# two values were left empty — and that reasoning is precisely what made them
# safe to fill today.
#
# TWO PARAGRAPHS ABOVE ARE NOW STALE, AND ARE STRUCK RATHER THAN DELETED:
#
#   1. "The session that wrote this could not read either value." Still true of
#      the Zero Trust scope — `npx wrangler whoami` lists none today either. But
#      the dashboard is no longer the only place the values live.
#   2. "The Access application has NO POLICY ATTACHED and enforces nothing."
#      No longer true. The owner has since created the application and attached
#      a policy, and the same uncredentialed GET now returns a 302 to
#      cloudflareaccess.com rather than the Worker's own 401.
#
# WHERE THESE TWO VALUES CAME FROM. Cloudflare Access publishes both itself, in
# the 302 it issues to an uncredentialed request — no Zero Trust scope needed:
#
#   $ curl -i https://office.avivnofar.com/admin/spec
#   HTTP/1.1 302 Found
#   Location: https://dark-credit-3c26.cloudflareaccess.com/cdn-cgi/access/
#             login/office.avivnofar.com?kid=<the 64-hex AUD tag>&meta=<jwt>
#
# THEY WERE READ, AND THE DIFFERENCE FROM A GUESS WAS PROVED, NOT ASSERTED.
# The session prompt made a guessed AUD a hard stop, for the reason stated
# above: a wrong audience accepts tokens minted for a different application.
# The AUD appears TWICE in that single response — once as the `kid` query
# parameter, and once as the `aud` claim of the `meta` JWT that Cloudflare
# Access SIGNED ITSELF. That meta token was verified this session against the
# key published at this team domain's own /cdn-cgi/access/certs:
#
#   signing kid 482f151d… found in the team's JWKS  : true
#   RS256 signature verifies                        : true
#   signed `aud`      : 77c18bb8… (identical to the kid param)
#   signed `hostname` : office.avivnofar.com  ← THIS application
#   tampered-aud negative control verifies          : false
#
# So the audience below is a cryptographically signed statement by THIS
# account's Access instance about THIS application — not an inference drawn
# from the shape of a URL. The negative control is there because a check that
# has only ever been seen to pass has not been seen to work.
[vars]
ACCESS_TEAM_DOMAIN = "dark-credit-3c26.cloudflareaccess.com"
ACCESS_AUD = "77c18bb835d44dd7e3ea07ab949cdf886221aad31488eda9babc5c1f1bba6b14"

# D1 database — storage for agents/agent_sessions/cases/interactions/reports/
# suggestions/weekly_analytics/meetings/side_plots/promotions/year_stats
# (database/schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "data-center-db"
database_id = "0819c65e-fa93-40cb-9894-c8dae0906f09"

# Live simulation overrides (inspection_mode/paused/phase) — see
# getSimulationState()/updateSimulationState() in agent-runner.js.
[[kv_namespaces]]
binding = "SIM_KV"
id = "62dd88c9524c4d048f99022a751a895e"

# Per-agent persisted state (mood/irritation/configOverrides) — see
# state-manager.js AgentStateDO.
[[durable_objects.bindings]]
name = "AGENT_STATE"
class_name = "AgentStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentStateDO"]

# Service binding to data-center-api — required because Cloudflare blocks a
# Worker from fetch()-ing another Worker's *.workers.dev URL directly (error
# 1042). interactWithApp() in agents/agent-base.js uses this binding.
[[services]]
binding = "APP_API"
service = "data-center-api"

# Version metadata — WHICH BUNDLE IS ACTUALLY ANSWERING.
#
# Added 2026-08-09. On that day a report run 34 seconds after a deploy was
# served by the PREVIOUS bundle, produced a defective report, and every signal
# reported success: the trigger returned 200, the pipeline returned ok, the
# report committed. Nothing in the system could say which code had run, so the
# stale bundle was inferred from timestamps afterwards rather than observed.
#
# `env.CF_VERSION_METADATA` gives { id, tag, timestamp } for the version
# serving THIS request. It is populated by the platform, costs no subrequest,
# and is the only thing here that can distinguish "the fix is deployed" from
# "the fix is uploaded and the old bundle is still answering". Surfaced in
# every /api/agents/trigger response and stamped into each published report's
# byline, so a stale-bundle run is identifiable after the fact.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers Logs - OWNED HERE, NOT BY THE DASHBOARD.
#
# Added 2026-08-24. The owner enabled Workers Logs for this Worker through the
# Cloudflare dashboard earlier the same day. That setting is owned by THIS
# FILE: a deploy from a config with no [observability] block turns it back off
# silently, with no error and no warning in the deploy output. Logs would have
# stopped and nothing would have said so until someone went looking - which is
# this estate's most-documented failure shape, and the same one the
# [version_metadata] block above exists to answer.
#
# Putting it in the config is the whole point. A dashboard toggle is exactly
# what the next deploy destroys; a committed block is what survives one.
#
# head_sampling_rate = 1 means KEEP EVERYTHING, and that is deliberate rather
# than lazy. The cron below fires 21 times a day; the Workers Free plan allows
# 200,000 log events a day. Sampling below 1 would discard evidence to save
# headroom this Worker has no way to consume, and the events discarded would
# be exactly the rare ones worth having - a scheduled block that threw, a
# swallowed D1 read, a stale bundle answering. Raise the sample only if the
# daily event count ever approaches the allowance, which at this volume it
# will not.
#
# invocation_logs = true keeps the per-invocation record (start, outcome,
# duration) and not only what the code chose to print. A tick that died before
# reaching any console.warn leaves no application log at all; the invocation
# log is the only thing that records it happened. That is precisely the shape
# of logScheduledError(), whose swallowed catch means the error AND the record
# of the error both vanish.
#
# RETENTION IS THREE DAYS on this plan, on a rolling window. The logs are
# pulled into back-office-AI-agents daily for exactly that reason - see that
# repo's .github/workflows/pull-worker-logs.yml. This block makes the logs
# exist; that workflow is what makes them outlive the window.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# Workers AI — case routing/classification (callCFRouter()) and the
# fallback when Groq is unavailable or Gemini returns 429 (quota exhausted).
# Account-scoped binding, no extra credentials needed. See
# workers/gemini-client.js callCFRouter() / callCloudflareFallback().
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put <NAME>`, not here):
#   GEMINI_API_KEY    - required, report synthesis (monthly/quarterly/semi_yearly/yearly)
#                       + the Guides pipeline's writer-persona drafts
#   GROQ_API_KEY      - required, routine per-case agent work (callGroq(), config/token-economy.json)
#   GOOGLE_AI_API_KEY - optional, reserved for Google AI Studio report tooling (see token-economy.json)
#   ADMIN_TOKEN       - required, validates X-Admin-Token on /api/agents/*
#   GITHUB_TOKEN      - optional, gates report/guide commits + claude-action issues to GitHub.
#                       PUBLIC REPO ONLY. resolveRepoWrite() (workers/repo-write.js)
#                       maps the token to the destination repo with no fallback, so
#                       this one is never presented to a private target.
#   BACKOFFICE_REPO_TOKEN - required by TWO modules, and this line was missing from
#                       this block until 2026-08-08 despite both depending on it:
#                         * workers/office-context.js fetchOfficeSnapshot() — READS
#                           back-office BOARD.md + CLIENT-REQUIREMENTS.md. Unset does
#                           NOT raise: it returns {board:null, requirements:null,
#                           errors:['BACKOFFICE_REPO_TOKEN is not configured…']}, so
#                           `office_context_enabled` reads ON while every report is
#                           built on an empty office context. Probe it with
#                           `POST /api/agents/trigger {"type":"office_context_status"}`,
#                           which reports the token's presence and the parsed counts.
#                         * workers/repo-write.js — the WRITE credential for
#                           back-office-AI-agents (REPO_TO_TOKEN_SECRET), the path
#                           plan item 0.3 built. Unmapped or unset is a denial, never
#                           a fallback to GITHUB_TOKEN above.
#                       CONFIRMED SET on the Worker 2026-08-08 (owner).
#   WAREHOUSE_REPO_TOKEN - mapped in repo-write.js and DELIBERATELY NOT SET. The
#                       warehouse code-write exception is enforceable but not live:
#                       a warehouse write passes the code rule and is then denied for
#                       want of a token. Two independent locks — see CLAUDE.md.
#   GITHUB_MODELS_TOKEN - REMOVED 2026-08-06. GitHub Models was permanently retired
#                       on 2026-07-30; its client is deleted and no code reads this.
#                       The secret is DEAD and should be deleted from the Worker:
#                         npx wrangler secret delete GITHUB_MODELS_TOKEN
#                       This is NOT GITHUB_TOKEN above. That one carries repo WRITE
#                       scope for report/guide commits, is still required, and must
#                       NOT be deleted. The two were deliberately separate secrets
#                       precisely so one could be revoked without touching the other.
#   CEREBRAS_API_KEY  - task-type routing, judgment AND long-document lanes
#                       (workers/cerebras-client.js). Primary on both since the
#                       GitHub Models removal — see config/model-routing.json's
#                       _concentration_risk note.
#   MISTRAL_API_KEY   - task-type routing, backup lanes (workers/mistral-client.js)
#   COHERE_API_KEY    - task-type routing, embeddings lane (workers/cohere-client.js).
#                       No callers yet — the local brain's search is not built.
#                       TRIAL key, 1000 calls/MONTH — see config/token-economy.json.
#                       All three fail closed (logged, null) while unset. Routing itself
#                       ships OFF behind SIM_KV `routing_enabled`; see CLAUDE.md.
#   ANTHROPIC_API_KEY - required for the Guides pipeline (workers/claude-client.js,
#                       direct https://api.anthropic.com/v1/messages calls — the
#                       error-1042 *.workers.dev restriction doesn't apply to
#                       external hosts, so no service binding is needed). The
#                       11-agent Q&A engine's own Claude asks still go through
#                       the APP_API service binding above, unaffected by this.

# ── THE OFFICE'S OWN ADDRESS — office.avivnofar.com ──────────────────────────
#
# Added 2026-08-24 (Session 16, Item A). A Workers CUSTOM DOMAIN, not a route:
# Cloudflare creates the proxied DNS record for the hostname and provisions its
# certificate, and it does so for the SUBDOMAIN ONLY.
#
# WHAT THIS DELIBERATELY DOES NOT TOUCH: the apex `avivnofar.com`. That
# hostname is registered here and SERVED BY NETLIFY, which manages its own
# certificate. Proxying the apex through Cloudflare to catch an /office/*
# route would put a working production site's TLS in the path of a cosmetic
# gain. It is not done, and a future session must not "tidy" this into an apex
# route. A custom domain on a subdomain is scoped to that hostname and cannot
# reach the apex record.
#
# WHY IT IS IN THIS FILE AND NOT THE DASHBOARD. Custom domains can be attached
# from the Cloudflare dashboard, and a dashboard-attached domain is exactly
# what the next `wrangler deploy` from a config that does not declare it tears
# down - silently, with the deploy reporting success. This estate has recorded
# that shape six times and the [observability] block twenty lines up exists for
# the same reason. The address the owner is given must survive a deploy.
[[routes]]
pattern = "office.avivnofar.com"
custom_domain = true

# Per-block office-simulation cron — OFFICE HOURS, 08:00-18:00 Israel.
#
# CHANGED 2026-08-06 from `*/30 0-13,23 * * *` (which was 02:00-16:30 Israel,
# 30 ticks/day) to the two expressions below (08:00-18:00 Israel, 21
# ticks/day). The old window started before dawn because it was set to the
# owner's own activity window in July, not to anything the office needed.
#
# THE ARITHMETIC, against IDT = UTC+3, so you can re-derive it rather than
# trust it:
#   `*/30 5-14 * * *` -> minutes {0,30} x hours {5..14} UTC
#                     =  05:00 .. 14:30 UTC  =  08:00 .. 17:30 Israel  (20)
#   `0 15 * * *`      ->  15:00 UTC          =  18:00 Israel exactly    (1)
#                                               ------------------------
#                                               08:00-18:00 inclusive   21
#
# WHY TWO EXPRESSIONS AND NOT `*/30 5-15`: that form would also fire at
# 15:30 UTC = 18:30 Israel, half an hour past closing. The single `0 15`
# picks up the 18:00 boundary tick without the 18:30 one.
#
# Each tick, scheduled() converts to Israel local time and calls
# runScheduledBlock(), which is a NO-OP unless config/daily-schedule.json
# has a block at that exact time for that day-of-week. Ticks are therefore
# cheap; blocks are what cost anything.
#
# CONFIG THAT MOVED WITH THIS — config/daily-schedule.json. Five case_batch
# blocks sat before 08:00 (Sun-Thu 02:00/04:30/07:00, Friday 02:00/05:30)
# and were RETIMED into this window in the same change, not left outside
# it. That was not cosmetic: partitionCasesByShare() (agent-runner.js
# L1203) allocates each batch its `case_share` slice UP FRONT and does not
# redistribute a slice whose block never fires, so leaving them would have
# silently DROPPED 50% of a Sun-Thu day's question volume and 70% of a
# Friday's. No share value was edited and no block was added or removed —
# only times moved, so day totals are unchanged. Every block time must land
# on a :00 or :30 tick inside this window or it is simply never reached.
#
# DST CAVEAT — UNCHANGED AND STILL LOAD-BEARING. When Israel switches to
# IST (UTC+2, late Oct) or back to IDT (late Mar), update BOTH this cron
# window AND ISRAEL_UTC_OFFSET_HOURS (agent-runner.js L1767, hardcoded 3) —
# see CLAUDE.md. Neither self-corrects. At UTC+2 and with this cron left
# alone, the window silently becomes 07:00-17:00 Israel.
#
# DST AND THE LOCAL AUTOMATION RUNS. The Windows Task Scheduler runs on the
# owner's machine fire at 00:00 and 05:00 Israel LOCAL time (owner
# decision, 2026-08-06), and Task Scheduler self-corrects across DST
# because it is wall-clock local. This cron does not. At UTC+3 the 05:00
# run is 3 hours clear of this window's 08:00 open; at UTC+2 the window
# opens at 07:00 instead and that margin narrows to 2 hours. The
# separation survives the DST shift; the margin does not — so a future
# widening of this window toward the morning spends that margin.
# (ARCHITECT-AUTOMATION-SPEC.md in back-office states 02:30 and 07:28.
# Those times are STALE and superseded by the above; that file belongs to
# a separate chat and is corrected there, not here. The divergence is
# recorded in back-office-AI-agents/plans/OFFICE-SCALING-TODO.md.)
#
# RE-ENABLED 2026-07-18 (first live activation of the Q&A engine, after the
# 2026-07-08 pause) — first-days volume is capped by
# config/token-economy.json's graduated_rollout_throttle, see
# TOKEN-BUDGET.md's 2026-07-18 activation entry.
[triggers]
# RESTORED 2026-08-11 after plan 0.4 stage 1 (meeting reports -> back-office)
# verified live: real write landed in back-office, read back via git pull;
# public repo's reports/meetings/ confirmed unaffected.
#
# == STOOD DOWN 2026-09-05 (SESSION 45) =====================================
#
# The owner decided to stand the office down. The record is
# `back-office-AI-agents/docs/decisions/RETIRED-CAPABILITIES.md` R-002, and its
# RESTART section is what a future session follows to bring this back.
#
# NOTHING IS DELETED. The two expressions this Worker ran on are preserved
# verbatim on the line below, commented, and restoring them is uncommenting one
# line and deploying:
#
#   crons = ["*/30 5-14 * * *", "0 15 * * *"]
#
# WHY AN EMPTY ARRAY AND NOT A DELETED BLOCK. An ABSENT `[triggers]` block does
# not remove anything -- wrangler leaves the account's existing schedules alone,
# so deleting these lines would have left both crons armed while the config
# looked stopped. That is this estate's most-documented failure shape and the
# reason the `[observability]` and `[[routes]]` blocks are in this file at all.
# An explicit empty array is a deploy-time instruction to remove every schedule,
# and it is read back from the Cloudflare API after the deploy rather than
# assumed.
#
# THIS IS THE SECOND LOCK, NOT THE FIRST. The first is SIM_KV
# `simulation-state.paused = true`, set the same day, which makes
# runScheduledBlockInner() return `{skipped:true, reason:'paused'}` before any
# block is entered. The switch was preferred -- a cleaner reversal, and no
# deploy -- and this exists so the tick does not fire at all rather than firing
# into a no-op. EITHER ONE ALONE STOPS THE OFFICE. Both must be reversed to
# restart it, and the RESTART section says so in that order.
#
# The 21-tick office-hours window above, its arithmetic and its DST caveat are
# deliberately left intact: they are what the restored line means.
crons = []

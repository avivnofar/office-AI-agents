name: Weekly Capability Audit (Agent 13)

# Phase 5, 2026-08-11 (Audit-and-Fix session): the capability audit becomes
# RECURRING WEEKLY work the Cyber Expert (agent 13) owns, not a one-off run.
# His standing question is "is this gate actually on the calling path" —
# applied here to roles, the same way the one-off 2026-08-10 run found the
# Designer's two-month gap. A weekly cadence finds the NEXT one.
#
# Runs OUTSIDE the Worker on purpose: `scripts/capability-audit.mjs`'s own
# header explains why — a Worker has no filesystem, and the audit's whole
# question ("does this code path exist") can only be answered by reading the
# code. This job has the checked-out repo; the Worker does not.
#
# Findings go to the board AS TASKS, not into a report nobody acts on — the
# exact failure this mechanism exists to avoid reproducing. `node
# scripts/capability-audit.mjs --findings` shapes non-SUPPLIED capabilities
# into board-task items (workers/capability-audit.js
# auditFindingsToBoardItems()) and this workflow POSTs them to the deployed
# Worker's `{"type":"capability_audit_findings"}` admin trigger, which
# normalizes and writes them to the SAME board-inbox path meeting action
# items already use (workers/meeting-engine.js writeActionItemsToBoard()) —
# not a new write mechanism. The Workflow (Agent 12) accepts or rejects them
# from there and allocates real OB-NNN ids, same as any other proposed task.

on:
  schedule:
    # Sunday 06:00 UTC — before the office's own Sunday work begins, so a
    # fresh finding is on the board before the week it concerns starts.
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  capability-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check configuration
        id: config
        run: |
          if [ -n "${{ vars.AGENTS_API_BASE }}" ] && [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.config.outputs.ready != 'true'
        run: |
          echo "### Weekly Capability Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: set the \`AGENTS_API_BASE\` repo variable and the \`ADMIN_TOKEN\` secret to enable (see DEPLOY.md). No new secret is required beyond what \`agent-reports.yml\` already uses." >> "$GITHUB_STEP_SUMMARY"

      # No filesystem access needed beyond this checkout — the audit reads
      # config/capability-manifest.json and workers/*.js source directly.
      #
      # `|| true` on both: capability-audit.mjs's own exit code is NON-ZERO
      # when the gate finds a blocking problem — the opposite of a reason to
      # skip posting, since that is exactly the moment findings matter most.
      # stdout is already fully written to the file before the process exits
      # either way. That reasoning was right and stays.
      #
      # ── WHAT WAS WRONG, AND WHAT CHANGED (2026-08-15, KFM-05 / finding #4)
      #
      # `|| true` on every step meant NOTHING IN THIS JOB COULD EVER GO RED.
      # A green light wired to nothing. Swallowing the code so the post
      # happens and never looking at it again are two different decisions,
      # and only the first one was intended.
      #
      # So the code is now CAPTURED here and RE-RAISED in the final step,
      # AFTER the findings have been posted. Ordering is the whole fix: the
      # post still happens on a failing audit, and the run still goes red.
      - name: Run the audit and shape findings
        id: audit
        if: steps.config.outputs.ready == 'true'
        run: |
          set +e
          node scripts/capability-audit.mjs --findings > /tmp/findings.json
          echo "gate_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Also render the human-readable findings document (for the run log)
        if: steps.config.outputs.ready == 'true'
        run: node scripts/capability-audit.mjs > /tmp/findings.md || true

      - name: Post findings to the board inbox
        if: steps.config.outputs.ready == 'true'
        run: |
          curl -sf -X POST "${{ vars.AGENTS_API_BASE }}/api/agents/trigger" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/findings.json \
            -o /tmp/result.json

      - name: Summary
        if: steps.config.outputs.ready == 'true'
        run: |
          echo "### Weekly Capability Audit — result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Full findings document</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/findings.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      # THE STEP THAT CAN FAIL THE RUN. Added 2026-08-15 (KFM-05 / audit #4).
      #
      # Deliberately LAST: the findings are already posted to the board and
      # the summary is already written, so failing here costs no information
      # — it only makes the failure visible. Before this step existed, every
      # step ended in `|| true` and the job was structurally incapable of
      # going red, which is a gate wired to nothing.
      #
      # It fails on capability-audit.mjs's exit code, and that code is now
      # computed from `roleVerdict` — "can this role produce its own declared
      # output" — rather than from `canWork`, which one supplied capability
      # of any kind flipped true. See that script's own GATE block.
      #
      # A gap that is genuinely known does NOT fail the run: the script
      # passes a PARTLY_SUPPLIED role whose blocking capability names a board
      # task in the manifest. So this going red means something new and
      # unboarded, not a standing item.
      - name: Fail the run if the capability gate found a blocking problem
        if: steps.config.outputs.ready == 'true' && steps.audit.outputs.gate_exit != '0'
        run: |
          echo "::error::The capability gate exited ${{ steps.audit.outputs.gate_exit }} — a non-dormant agent cannot produce a declared output kind, and it is not boarded. See the findings document in the summary above; the findings have already been posted to the board inbox."
          exit 1

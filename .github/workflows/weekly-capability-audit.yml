name: Weekly Capability Audit (Agent 13)

# Phase 5, 2026-08-11 (Audit-and-Fix session): the capability audit becomes
# RECURRING WEEKLY work the Cyber Expert (agent 13) owns, not a one-off run.
# His standing question is "is this gate actually on the calling path" —
# applied here to roles, the same way the one-off 2026-08-10 run found the
# Designer's two-month gap. A weekly cadence finds the NEXT one.
#
# Runs OUTSIDE the Worker on purpose: `scripts/capability-audit.mjs`'s own
# header explains why — a Worker has no filesystem, and the audit's whole
# question ("does this code path exist") can only be answered by reading the
# code. This job has the checked-out repo; the Worker does not.
#
# Findings go to the board AS TASKS, not into a report nobody acts on — the
# exact failure this mechanism exists to avoid reproducing. `node
# scripts/capability-audit.mjs --findings` shapes non-SUPPLIED capabilities
# into board-task items (workers/capability-audit.js
# auditFindingsToBoardItems()) and this workflow POSTs them to the deployed
# Worker's `{"type":"capability_audit_findings"}` admin trigger, which
# normalizes and writes them to the SAME board-inbox path meeting action
# items already use (workers/meeting-engine.js writeActionItemsToBoard()) —
# not a new write mechanism. The Workflow (Agent 12) accepts or rejects them
# from there and allocates real OB-NNN ids, same as any other proposed task.

on:
  schedule:
    # Sunday 06:00 UTC — before the office's own Sunday work begins, so a
    # fresh finding is on the board before the week it concerns starts.
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  capability-audit:
    runs-on: ubuntu-latest
    # OB-085 (2026-08-16): needed so the growth-watch step can extend
    # reports/growth/LEDGER.jsonl. Scoped to this job and no wider — nothing
    # else here writes, and `contents: write` on a workflow that posts model
    # output to an API is the permission worth keeping narrow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check configuration
        id: config
        run: |
          if [ -n "${{ vars.AGENTS_API_BASE }}" ] && [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.config.outputs.ready != 'true'
        run: |
          echo "### Weekly Capability Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: set the \`AGENTS_API_BASE\` repo variable and the \`ADMIN_TOKEN\` secret to enable (see DEPLOY.md). No new secret is required beyond what \`agent-reports.yml\` already uses." >> "$GITHUB_STEP_SUMMARY"

      # No filesystem access needed beyond this checkout — the audit reads
      # config/capability-manifest.json and workers/*.js source directly.
      #
      # `|| true` on both: capability-audit.mjs's own exit code is NON-ZERO
      # when the gate finds a blocking problem — the opposite of a reason to
      # skip posting, since that is exactly the moment findings matter most.
      # stdout is already fully written to the file before the process exits
      # either way. That reasoning was right and stays.
      #
      # ── WHAT WAS WRONG, AND WHAT CHANGED (2026-08-15, KFM-05 / finding #4)
      #
      # `|| true` on every step meant NOTHING IN THIS JOB COULD EVER GO RED.
      # A green light wired to nothing. Swallowing the code so the post
      # happens and never looking at it again are two different decisions,
      # and only the first one was intended.
      #
      # So the code is now CAPTURED here and RE-RAISED in the final step,
      # AFTER the findings have been posted. Ordering is the whole fix: the
      # post still happens on a failing audit, and the run still goes red.
      - name: Run the audit and shape findings
        id: audit
        if: steps.config.outputs.ready == 'true'
        run: |
          set +e
          node scripts/capability-audit.mjs --findings > /tmp/findings.json
          echo "gate_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Also render the human-readable findings document (for the run log)
        if: steps.config.outputs.ready == 'true'
        # swallow-ok: the SAME command's exit code is already captured as
        # `gate_exit` in the step above and re-raised in the final step. This
        # is a second render for the run summary, not a second gate — reading
        # the code twice would double-report one failure (KFM-06).
        run: node scripts/capability-audit.mjs > /tmp/findings.md || true

      - name: Post findings to the board inbox
        if: steps.config.outputs.ready == 'true'
        run: |
          curl -sf -X POST "${{ vars.AGENTS_API_BASE }}/api/agents/trigger" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/findings.json \
            -o /tmp/result.json

      # ── FAILURE-MODE WALK (2026-08-16, OB-101) ───────────────────────────
      #
      # KNOWN-FAILURE-MODES.md's closing section has claimed since 2026-08-15
      # that `scripts/failure-mode-walk.mjs` is "run weekly by
      # .github/workflows/weekly-capability-audit.yml". Neither the script nor
      # this step existed. That was the TWELFTH false mechanization claim in a
      # file whose own correction block is about eleven of them — and the
      # largest, because it claimed the whole mechanized subset was walked.
      #
      # This step is the second half of the fix. It rides this job for the same
      # reason growth-watch does: same weekly cadence, same audience.
      #
      # COVERAGE HERE IS PARTIAL AND SAYS SO. Two of the six checks (`labels`,
      # `citedfile`) read the private back-office repo, for which this job holds
      # no credential. They report `NOT_WALKED` WITH A REASON and do not count
      # as passes — a checklist walker reporting "0 problems" because it could
      # not see the checklist would be KFM-13's shape committed by the
      # instrument built to catch it.
      #
      # It is captured and re-raised at the end, like every other gate in this
      # file, so it cannot fail silently (KFM-05, applied to itself).
      - name: Failure-mode walk — the mechanized subset of KNOWN-FAILURE-MODES.md
        id: fmwalk
        if: steps.config.outputs.ready == 'true'
        run: |
          set +e
          node scripts/failure-mode-walk.mjs > /tmp/fmwalk.md
          echo "fmwalk_exit=$?" >> "$GITHUB_OUTPUT"

      # ── GROWTH WATCH (2026-08-16, audit #12/#18/#19/#20/#24) ──────────────
      #
      # KFM-20 asks of every store that only grows: a cap, a retirement path,
      # or AT MINIMUM a trend someone reads. Finding #12 is that the need was
      # identified across seven consecutive sweeps and nothing was built. This
      # is the caller, added in the same session as the tool — because a
      # detection primitive with no consumer is the defect the whole audit is
      # about (KFM-10/KFM-26), and this repo already has one of those in
      # back-office `tools/repo-size-hygiene-check/` ("R7 — nothing calls this").
      #
      # It rides this job rather than getting a schedule of its own: same
      # weekly cadence, same audience, same moment. It never fails the run —
      # there is no threshold yet, and a gate with an invented number behind it
      # is worse than no gate.
      #
      # COVERAGE HERE IS PARTIAL AND THAT IS RECORDED, NOT PAPERED OVER: this
      # job holds no credential for either private repo, so the back-office
      # journal and board metrics come back `not measured` with that as the
      # stated reason. `trendFor()` compares each metric against the last run
      # that could read IT, so a laptop run and a CI run interleave without
      # either one reporting a private store as having shrunk to zero.
      # ── OB-085 CLOSED, 2026-08-16 ────────────────────────────────────────
      #
      # `--no-append` is GONE. This job now extends the ledger, so the trend
      # survives a week with no local run. What that changes and what it must
      # not change:
      #
      #   · The CI row carries `not_measured` WITH A REASON for every
      #     back-office and warehouse metric, because this job holds no
      #     credential for either private repo. That is written to the ledger
      #     exactly as measured. NOTHING HERE FILLS A ZERO, and nothing may:
      #     `trendFor()` compares each metric against the last run that
      #     measured THAT metric, so an honest `not_measured` degrades the
      #     trend's resolution while a zero would publish the back-office
      #     journals collapsing to nothing every Sunday — KFM-13's shape,
      #     committed by the instrument built to watch for it.
      #   · Recording the measurement must never cost the audit (KFM-14), so a
      #     failed append or push does not abort the job. It is CAPTURED here
      #     and re-raised at the end, the same shape `gate_exit` already uses
      #     in this file — the run still goes red, after the findings are
      #     posted and the summary is written.
      - name: Growth watch — measure the unbounded stores and extend the ledger
        id: growth
        if: steps.config.outputs.ready == 'true'
        env:
          AGENTS_API_BASE: ${{ vars.AGENTS_API_BASE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          node scripts/growth-watch.mjs > /tmp/growth.md
          echo "growth_exit=$?" >> "$GITHUB_OUTPUT"

      # Commits ONLY the ledger. `git add` names the one path deliberately:
      # the audit steps above write to /tmp, but a `git add -A` here would
      # sweep up anything a future step happens to leave in the tree and
      # commit it under an unrelated message.
      #
      # `[skip ci]` matches every other automated commit in this repo.
      # Rebase-and-retry because the live Worker commits to this same branch
      # on its own cron and a Sunday 06:00 UTC run can collide with it.
      - name: Commit the growth ledger row
        id: ledger_commit
        if: steps.config.outputs.ready == 'true'
        run: |
          set +e
          if git diff --quiet -- reports/growth/LEDGER.jsonl; then
            echo "No ledger change to commit (growth-watch may not have appended)."
            echo "commit_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/growth/LEDGER.jsonl
          git commit -m "chore(growth): weekly growth-watch ledger row [skip ci]"
          ok=1
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && { ok=0; break; }
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "commit_exit=$ok" >> "$GITHUB_OUTPUT"

      # ── THE MODEL-CATALOGUE CHECK (2026-08-23, Session 14 ITEM C) ────────
      #
      # Five model identifiers have been retired out from under this estate and
      # every one was found by something BREAKING, not by anything looking:
      #
      #   gemini-3.5-flash · gemini-2.5-flash · cerebras llama-3.3-70b
      #   groq llama3-8b-8192 · groq llama-3.1-8b-instant
      #
      # The last one is why this step exists rather than another verifier.
      # `llama-3.1-8b-instant` was adopted on 2026-08-09 AS THE FIX for the one
      # before it, and it was already on Groq's published deprecation list at
      # that moment with a shutdown date already set. That session checked the
      # live catalogue and the model was there — presence and health look
      # identical. Nothing ever ran the check a second time, and on 2026-08-16
      # it went away.
      #
      # ── WHY IT RIDES THIS JOB AND NEEDS NO NEW SECRET ────────────────────
      #
      # Same weekly cadence, same audience, same moment — the reason growth-watch
      # and the failure-mode walk ride here too. And the credentials already
      # exist: it POSTs to the Worker's `{"type":"model_catalog"}` admin trigger
      # with the SAME `vars.AGENTS_API_BASE` + `secrets.ADMIN_TOKEN` this job's
      # config gate already checks for. No new secret, which the OB-130 remedy
      # rules out anyway.
      #
      # ── WHY THE CHECK RUNS IN THE WORKER AND NOT HERE ────────────────────
      #
      # AD-030: a secret you cannot read is a secret you cannot verify, so the
      # only meaningful catalogue check is the one made by the thing that will
      # make the call. A runner holding a key from a repo secret would test THAT
      # key. The Worker holds the keys that actually answer production traffic.
      #
      # Captured and re-raised at the end, like every other gate in this file
      # (KFM-05). It makes NO generation call and spends no model budget: one
      # listing endpoint per provider.
      - name: Model catalogue — is every configured model identifier still alive
        id: catalog
        if: steps.config.outputs.ready == 'true'
        run: |
          set +e
          curl -s -X POST "${{ vars.AGENTS_API_BASE }}/api/agents/trigger"             -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"             -H "Content-Type: application/json"             -d '{"type":"model_catalog"}'             -o /tmp/catalog.json
          node -e '
            const fs = require("fs");
            let r;
            try { r = JSON.parse(fs.readFileSync("/tmp/catalog.json", "utf8")); }
            catch (e) { console.log("catalogue check response was unreadable: " + e.message); process.exit(2); }
            const c = r.result || r;
            console.log(c.summary || JSON.stringify(c, null, 1));
            // Exit 1 ONLY on an absent CONFIGURED identifier. `not_checkable`
            // and `check_failed` are printed above and do not fail the run —
            // an unreadable catalogue is not evidence that a model is gone,
            // and treating it as one would manufacture the false credential
            // accusation AD-030 exists to forbid.
            process.exit(c.ok === false ? 1 : 0);
          ' > /tmp/catalog.md
          echo "catalog_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.config.outputs.ready == 'true'
        run: |
          echo "### Model catalogue — are the configured model IDs still alive" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/catalog.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "the catalogue check produced no output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failure-mode walk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/fmwalk.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_the failure-mode walk produced no output_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Growth watch" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/growth.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "_growth watch produced no output_" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Weekly Capability Audit — result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Full findings document</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/findings.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      # THE STEP THAT CAN FAIL THE RUN. Added 2026-08-15 (KFM-05 / audit #4).
      #
      # Deliberately LAST: the findings are already posted to the board and
      # the summary is already written, so failing here costs no information
      # — it only makes the failure visible. Before this step existed, every
      # step ended in `|| true` and the job was structurally incapable of
      # going red, which is a gate wired to nothing.
      #
      # It fails on capability-audit.mjs's exit code, and that code is now
      # computed from `roleVerdict` — "can this role produce its own declared
      # output" — rather than from `canWork`, which one supplied capability
      # of any kind flipped true. See that script's own GATE block.
      #
      # A gap that is genuinely known does NOT fail the run: the script
      # passes a PARTLY_SUPPLIED role whose blocking capability names a board
      # task in the manifest. So this going red means something new and
      # unboarded, not a standing item.
      - name: Fail the run if the capability gate found a blocking problem
        if: steps.config.outputs.ready == 'true' && steps.audit.outputs.gate_exit != '0'
        run: |
          echo "::error::The capability gate exited ${{ steps.audit.outputs.gate_exit }} — a non-dormant agent cannot produce a declared output kind, and it is not boarded. See the findings document in the summary above; the findings have already been posted to the board inbox."
          exit 1

      # OB-101: the failure-mode walk must not be able to fail silently either.
      # Kept as its own step and its own message rather than merged with the
      # gate above — two different failures, and merging them would hide which
      # one fired (KFM-06). Placed after the findings post and the summary, so
      # the walk's own output is readable at the moment it goes red.
      - name: Fail the run if the failure-mode walk found a blocking problem
        if: steps.config.outputs.ready == 'true' && steps.fmwalk.outputs.fmwalk_exit != '0'
        run: |
          echo "::error::The failure-mode walk exited ${{ steps.fmwalk.outputs.fmwalk_exit }} — a check in the mechanized subset of KNOWN-FAILURE-MODES.md refused. The full walk is in the summary above; NOT_WALKED entries are reported and never counted as passes."
          exit 1

      # OB-085: the growth watch must not be able to fail SILENTLY either.
      # Separate from the gate above and placed after it, because these are
      # two different failures and merging them would hide which one fired
      # (KFM-06). A lost ledger row costs trend resolution, not the audit —
      # which is why it is re-raised here rather than aborting the job.
      # OB-??? / Session 14 ITEM C: the catalogue check must not fail silently
      # either. Its own step and its own message rather than merged with the
      # gates above — three different failures, and merging them would hide
      # which one fired (KFM-06). Placed after the summary so the catalogue
      # listing is readable at the moment it goes red.
      #
      # A red here means a model this estate is CONFIGURED to send has left its
      # provider's catalogue. That is a config fix — change the identifier — and
      # it is NEVER a credential problem: the same key read the catalogue
      # successfully in the same call. AD-030 forbids proposing a key rotation
      # before four checks, and this step has already made the first one.
      - name: Fail the run if a configured model identifier is gone from its provider
        if: steps.config.outputs.ready == 'true' && steps.catalog.outputs.catalog_exit != '0'
        run: |
          echo "::error::The model catalogue check exited ${{ steps.catalog.outputs.catalog_exit }} — a CONFIGURED model identifier is absent from its provider's live catalogue, or the check's own response was unreadable. See the catalogue section in the summary above. This is a CONFIG FIX, not a credential problem: the same key read that catalogue. Do NOT propose a key rotation (AD-030)."
          exit 1

      - name: Fail the run if the growth ledger could not be measured or recorded
        if: steps.config.outputs.ready == 'true' && (steps.growth.outputs.growth_exit != '0' || steps.ledger_commit.outputs.commit_exit != '0')
        run: |
          echo "::error::growth-watch exited ${{ steps.growth.outputs.growth_exit }} and the ledger commit exited ${{ steps.ledger_commit.outputs.commit_exit }}. The trend for this week was NOT recorded; the next run will compare against the last run that measured each metric, so the trend degrades in resolution rather than becoming wrong. Do NOT backfill this row by hand — a measurement taken later is not a measurement of this week."
          exit 1
